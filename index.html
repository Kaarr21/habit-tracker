<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json" />
</head>
<body class="bg-pink-50 min-h-screen p-4">
  <div id="auth" class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-md mb-6">
    <h2 class="text-2xl font-bold mb-4">Login or Signup</h2>
    <input id="email" type="email" placeholder="Email" class="mb-2 p-2 w-full border rounded" />
    <input id="password" type="password" placeholder="Password" class="mb-4 p-2 w-full border rounded" />
    <div class="flex gap-2">
      <button onclick="signup()" class="bg-green-500 text-white px-4 py-2 rounded">Sign Up</button>
      <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded ml-auto">Logout</button>
    </div>
  </div>

  <div id="tracker" class="hidden max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-3xl font-bold text-center mb-4">Habit Tracker</h1>
    <div id="streak" class="text-xl text-center text-pink-600 mb-4">🔥 Streak: 0 days</div>

    <label class="block mb-4">
      <span>Date:</span>
      <input type="date" id="date" class="mt-1 block w-full rounded border-pink-300" onchange="loadHabits()" />
    </label>

    <form id="habit-form" class="grid grid-cols-2 gap-4 mb-4">
      <label><input type="checkbox" name="bible" /> 📖 Bible Study</label>
      <label><input type="checkbox" name="journal" /> 📝 Journal</label>
      <label><input type="checkbox" name="hydrate" /> 💧 Hydrate</label>
      <label><input type="checkbox" name="workout" /> 🏋️ Workout</label>
      <label><input type="checkbox" name="read" /> 📚 Read</label>
      <label><input type="checkbox" name="study" /> 💻 Study</label>
    </form>

    <div class="mb-4">
      <label>🎯 Goal:</label>
      <input type="text" id="goal" class="block w-full p-2 border rounded mt-1" />
      <label class="inline-block mt-2"><input type="checkbox" id="goalDone" /> Done</label>
    </div>

    <div class="mb-4">
      <label>🗓️ Weekly Review:</label>
      <textarea id="review" rows="3" class="block w-full p-2 border rounded"></textarea>
    </div>

    <div class="mb-4">
      <label>📸 Upload Progress Photo:</label>
      <input type="file" id="photo" accept="image/*" class="block mt-1" />
    </div>

    <button onclick="saveData()" class="w-full bg-pink-500 text-white py-2 rounded hover:bg-pink-600">Save Progress</button>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
